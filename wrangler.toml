# Cloudflare Pages Configuration
# This file is used for deploying to Cloudflare Pages via GitHub integration

name = "gnpackaging"
compatibility_date = "2024-01-01"

# Build configuration for Cloudflare Pages
[build]
command = "cd frontend && npm install && npm run build"
cwd = "."
watch_dirs = ["frontend"]

# Directory containing the built files to deploy
[build.upload]
format = "directory"
dir = "frontend/build"

# Environment variables (optional - add as needed)
# [vars]
# NODE_ENV = "production"

# Redirects for SPA routing (also handled by _redirects file in public folder)
# Cloudflare Pages will automatically use the _redirects file from the build output